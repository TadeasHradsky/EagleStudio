<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EAGLE STUDIO — Přihlášení</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #080c14;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .glow-bg-1 {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(0, 210, 255, 0.35) 0%, rgba(0, 0, 0, 0) 70%);
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(90px);
      z-index: 0;
    }

    .glow-bg-2 {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(0, 150, 255, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
      bottom: 20%;
      right: 30%;
      filter: blur(80px);
      z-index: 0;
    }

    .login-card {
      position: relative;
      z-index: 1;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 210, 255, 0.25);
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                  inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .logo-icon {
      width: 50px;
      height: 50px;
      margin: 0 auto 15px auto;
      background: rgba(0, 210, 255, 0.1);
      border: 1px solid rgba(0, 210, 255, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
    }

    .logo-icon svg {
      width: 26px;
      height: 26px;
      fill: #00d2ff;
    }

    .logo h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .logo h1 span {
      color: #00d2ff;
      text-shadow: 0 0 12px rgba(0, 210, 255, 0.6);
    }

    .logo p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 6px;
      margin-bottom: 32px;
    }

    .btn-primary {
      width: 100%;
      padding: 14px 20px;
      background: #00d2ff;
      color: #060911;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-primary:hover {
      background: #5ee2ff;
      box-shadow: 0 0 30px rgba(0, 210, 255, 0.6);
      transform: translateY(-2px);
    }

    .btn-secondary {
      margin-top: 15px;
      padding: 10px 20px;
      background: rgba(255, 77, 77, 0.1);
      color: #ff5c5c;
      border: 1px solid rgba(255, 77, 77, 0.3);
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-secondary:hover {
      background: #ff4d4d;
      color: #ffffff;
      box-shadow: 0 0 15px rgba(255, 77, 77, 0.4);
    }

    .user-info {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 20px;
      margin-top: 10px;
    }

    .user-info p {
      font-size: 0.95rem;
      color: #cbd5e1;
      margin-bottom: 12px;
    }

    .user-info strong {
      color: #00d2ff;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #94a3b8;
      font-size: 0.85rem;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .back-link:hover {
      color: #00d2ff;
    }

    .hidden {
      display: none !important;
    }

    .footer-text {
      margin-top: 20px;
      font-size: 0.75rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="glow-bg-1"></div>
  <div class="glow-bg-2"></div>

  <div class="login-card">
    
    <div class="logo-icon">
      <svg viewBox="0 0 24 24">
        <path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4h-2l2 4h-3l-2-4H7L5 8H2v12h20V4h-4zM8 17l6-5-6-5v10z"/>
      </svg>
    </div>

    <div class="logo">
      <h1>EAGLE <span>STUDIO</span></h1>
      <p>Vstupte do světa filmů a seriálů</p>
    </div>

    <div id="auth-buttons">
      <button class="btn-primary" onclick="netlifyIdentity.open()">
        <span>Přihlásit se / Registrovat</span>
      </button>
    </div>

    <div id="user-info" class="user-info hidden">
      <p>Vítejte zpět,<br><strong id="user-email"></strong></p>
      <button class="btn-secondary" onclick="netlifyIdentity.logout()">Odhlásit se</button>
    </div>

    <div>
      <a href="index.html" class="back-link">&larr; Zpět na hlavní stránku</a>
    </div>

    <div class="footer-text">
      &copy; EAGLE STUDIO. Všechna práva vyhrazena.
    </div>
  </div>

  <script>
    netlifyIdentity.on('init', user => {
      updateUserUI(user);
    });

    netlifyIdentity.on('login', user => {
      updateUserUI(user);
      netlifyIdentity.close();
    });

    netlifyIdentity.on('logout', () => {
      updateUserUI(null);
    });

    function updateUserUI(user) {
      const userInfo = document.getElementById('user-info');
      const userEmail = document.getElementById('user-email');
      const authButtons = document.getElementById('auth-buttons');

      if (user) {
        userEmail.innerText = user.email;
        userInfo.classList.remove('hidden');
        authButtons.classList.add('hidden');
      } else {
        userInfo.classList.add('hidden');
        authButtons.classList.remove('hidden');
      }
    }
  </script>

</body>
</html>
