<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EAGLE STUDIO — Filmy a Seriály</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #080c14;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* --- NAVIGACE --- */
    navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 8%;
      background: rgba(8, 12, 20, 0.85);
      backdrop-filter: blur(15px);
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(0, 210, 255, 0.15);
    }

    .logo h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .logo h1 span {
      color: #00d2ff;
      text-shadow: 0 0 12px rgba(0, 210, 255, 0.6);
    }

    /* Tlačítko přihlášení (před přihlášením) */
    .nav-btn {
      padding: 10px 24px;
      background: #00d2ff;
      color: #060911;
      text-decoration: none;
      font-weight: 600;
      border-radius: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
    }

    .nav-btn:hover {
      background: #5ee2ff;
      box-shadow: 0 0 25px rgba(0, 210, 255, 0.6);
      transform: translateY(-2px);
    }

    /* Profil uživatele v navigaci (po přihlášení) */
    .user-nav-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-circle {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #00d2ff, #0072ff);
      color: #080c14;
      font-weight: 700;
      font-size: 1.2rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.5);
      text-transform: uppercase;
    }

    .user-name-text {
      font-weight: 600;
      font-size: 0.95rem;
      color: #e2e8f0;
    }

    .logout-btn {
      background: transparent;
      border: 1px solid rgba(255, 77, 77, 0.4);
      color: #ff5c5c;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      margin-left: 10px;
      transition: all 0.3s ease;
    }

    .logout-btn:hover {
      background: #ff4d4d;
      color: #fff;
    }

    /* --- POHLED PRO NEPŘIHLÁŠENÉ (LANDING) --- */
    .hero {
      position: relative;
      padding: 160px 8% 80px 8%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .glow-bg {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0, 210, 255, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      filter: blur(100px);
      z-index: -1;
    }

    .hero h2 {
      font-size: 2.8rem;
      max-width: 800px;
      line-height: 1.2;
      margin-bottom: 20px;
    }

    .hero h2 span { color: #00d2ff; }

    .hero p {
      color: #94a3b8;
      font-size: 1.1rem;
      max-width: 600px;
      margin-bottom: 35px;
    }

    .features {
      padding: 40px 8% 80px 8%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
    }

    .feature-card {
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 210, 255, 0.15);
      border-radius: 18px;
      padding: 30px;
      text-align: center;
    }

    .feature-card h3 { color: #00d2ff; margin: 10px 0; }
    .feature-card p { color: #94a3b8; font-size: 0.9rem; }

    /* --- POHLED PRO PŘIHLÁŠENÉ (CATALOG) --- */
    .dashboard {
      padding: 130px 8% 80px 8%;
    }

    .welcome-panel {
      background: linear-gradient(135deg, rgba(0, 210, 255, 0.15) 0%, rgba(15, 23, 42, 0.6) 100%);
      border: 1px solid rgba(0, 210, 255, 0.3);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 40px;
      margin-bottom: 50px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .welcome-panel h2 {
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    .welcome-panel h2 span {
      color: #00d2ff;
      text-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
    }

    .welcome-panel p {
      color: #cbd5e1;
      font-size: 1rem;
    }

    /* Filmové sekce a Karty */
    .section-title {
      font-size: 1.5rem;
      margin-bottom: 20px;
      border-left: 4px solid #00d2ff;
      padding-left: 12px;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 25px;
      margin-bottom: 50px;
    }

    .movie-card {
      position: relative;
      background: rgba(15, 23, 42, 0.7);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      aspect-ratio: 2 / 3;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px;
      transition: all 0.3s ease;
      cursor: pointer;
    }
